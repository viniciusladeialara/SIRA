version: '3.8'

services:
  # 1. PgHero: Dashboard Visual Inteligente para Consultas Travadas, Locks e Performance
  pghero:
    image: ankane/pghero
    container_name: pghero_agendamento
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@host.docker.internal:5432/agendamento_db"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 2. PostgreSQL Exporter: Coletor de Métricas Nativo do PostgreSQL
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres_exporter_agendamento
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@host.docker.internal:5432/agendamento_db?sslmode=disable"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 3. Prometheus: Coleta e Armazena Séries Temporais de Métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_agendamento
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 4. Grafana: Dashboard Visual Estilo Enterprise Dark Mode
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_agendamento
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
